; ============================================================
;  PC MONITOR for ESP32-2432S028 ("Cheap Yellow Display", 2USB)
;  ВАЖНО: вариант 2USB = ST7789 (не ILI9341!), пины TFT другие,
;  тач XPT2046 живёт на ОТДЕЛЬНОЙ шине VSPI (см. include/config.h)
;
;  Build:   pio run -t upload
;  Monitor: pio device monitor
; ============================================================

[env:cyd2usb]
; Пин версии: проект писался под Arduino core 2.0.17 (esp_task_wdt_init(sec, panic)).
; На машине стоят и более новые платформы — без пина PIO берёт их (core 3.x)
; и ломает сборку новым API сторожевого таймера.
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200

board_upload.speed = 460800

; --- TFT_eSPI настройка под CYD 2USB (ST7789) вместо правки User_Setup.h ---
; Пины — из официального DisplayConfig/CYD2USB/User_Setup.h (witnessmenow)
build_flags =
    -DUSER_SETUP_LOADED=1
    ; --- Шрифты TFT_eSPI. БЕЗ ЭТИХ ФЛАГОВ текст не рисуется вовсе: ---
    ; в этой версии библиотеки LOAD_GLCD (шрифт 1) включается ТОЛЬКО при
    ; SMOOTH_FONT, а шрифты 2/4/7 подключаются лишь по явному LOAD_FONTx.
    ; Проект использует setTextFont(1/2) и tftText(4/7) -> включаем все.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    ; Тач XPT2046 НЕ подключается к TFT_eSPI (отдельная шина VSPI):
    ; TOUCH_CS не определяем, в коде используется XPT2046_Touchscreen.

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
